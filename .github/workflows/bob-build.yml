# Builds the stand-alone Windows program for this fork on every push to main, or when started by hand, and keeps it
# as a workflow artifact to download. No installer and no signing key: `npm run release` builds
# target/release/FMLibreEditor.exe only.
name: Build my editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bob-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the interface's packages
        working-directory: app
        run: npm ci

      - name: Build the program
        working-directory: app
        run: npm run release

      - uses: actions/upload-artifact@v4
        with:
          name: FMLibreEditor-bob
          path: target/release/FMLibreEditor.exe
          if-no-files-found: error
